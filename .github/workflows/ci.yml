name: CI — Quality, Tests & Supabase pgTAP

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-build:
    name: Typecheck, Unit Tests & Multi-Club Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure reference club (demo-club)
        run: npm run configure:club -- --club=demo-club --env=staging

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit & RLS audit tests
        run: npm run test

      - name: Verify static export build for demo-club
        run: npm run build

      - name: Verify static export build for pinos-golf (production)
        run: |
          npm run configure:club -- --club=pinos-golf --env=production
          NEXT_PUBLIC_CLUB_ID=pinos-golf NEXT_PUBLIC_APP_ENV=production npm run build

  supabase-pgtap:
    name: Supabase PostgreSQL Migrations & pgTAP RLS Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase PostgreSQL & apply migrations
        run: supabase db start

      - name: Execute pgTAP database security test suite
        run: supabase test db
